# Firebase App Hosting config para notarygarcia.
# Clon técnico de notaryjose, corriendo como backend independiente dentro
# de notaryhost-33a33 (no lafayette-market-d64ff). Reutiliza los secrets de
# Twilio/Resend ya creados en este proyecto para el sitio principal de
# notaryhost.

runConfig:
  minInstances: 1
  maxInstances: 3
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  timeoutSeconds: 60

env:
  # Firebase web config es hardcoded en lib/firebase.ts (no es sensible,
  # va en el bundle del cliente de todas formas) — no necesita secrets.

  # ─── Resend (email) — ya existe en notaryhost-33a33 ───────
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability:
      - RUNTIME

  - variable: EMAIL_FROM
    value: 'no-reply@notaryhost.com'
    availability:
      - RUNTIME

  # ─── Twilio — cuenta compartida en notaryhost-33a33, número propio ──
  # ACCOUNT_SID/AUTH_TOKEN son de la cuenta de Twilio compartida (una
  # cuenta, muchos números). El número de teléfono en sí YA NO es un
  # secret aquí — se lee en vivo del campo twilioPhoneNumber del registro
  # de este notario en la colección central `notaries` (ver
  # app/lib/notaryProfile.ts), porque cada notario tiene su propio número
  # y ese dato puede cambiar/asignarse desde notaryhost.com/admin.
  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
    availability:
      - RUNTIME

  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
    availability:
      - RUNTIME

  # Used to build the TwiML callback URLs (Gather/Record/Dial action=)
  # Twilio calls back into during a voice call, and in the booking-link
  # SMS text. Without this the code falls back to the old notaryjose
  # domain — see app/api/twilio/voice/*.
  - variable: SITE_URL
    value: 'https://notarygarcia.notaryhost.com'
    availability:
      - RUNTIME

  # ─── Notary record — apunta a este negocio en la colección central
  # `notaries` de notaryhost-33a33 (gestionada desde notaryhost.com/admin).
  # businessName/ownerName/ownerPhone/ownerEmail se leen en vivo de ahí
  # (ver app/lib/notaryProfile.ts) en vez de estar congelados en secrets,
  # porque pueden cambiar con el tiempo. No es sensible — es solo un doc ID.
  - variable: NOTARY_ID
    value: '8dit4YeHfMLTYRZi5Fsw'
    availability:
      - RUNTIME

  # ─── Cron secret — autoriza llamadas de Cloud Scheduler ────
  # Nuevo, específico de este backend.
  - variable: CRON_SECRET
    secret: notarygarcia-cron-secret
    availability:
      - RUNTIME
